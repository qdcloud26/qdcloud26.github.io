<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiểm Tra IP</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        h2 { color: #333; }
        #ip-address {
            font-size: 24px;
            color: #007bff;
            font-weight: bold;
            margin: 20px 0;
        }
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <div class="container">
        <h2>IP của bạn:</h2>
        <div id="ip-address">Đang tải...</div>
        <button onclick="showIp(data)">Làm mới</button>
    </div>

    <script>
        async function getPublicIP() {
            const ipDisplay = document.getElementById('ip-address');
            ipDisplay.innerText = 'Đang tải...';
            try {
                // Gọi tới API miễn phí của ipify
                const response = await fetch('https://ip.tnd.vn?format=json');
                const data = await response.json();
                ipDisplay.innerText = data.ip;
            } catch (error) {
                ipDisplay.innerText = 'Không thể lấy được IP!';
                console.error(error);
            }
        }

        // Tự động gọi khi load trang
        getPublicIP();
    </script>

</body>
</html>
